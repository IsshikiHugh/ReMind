[project]
name = "remind"
version = "0.1.0"
description = "Print notes and todos to a Phomemo M02 thermal printer"
requires-python = ">=3.11"          # stdlib tomllib
dependencies = [
    "bleak",        # BLE transport (M02 over Bluetooth LE)
    "Pillow",       # text -> 1-bit raster rendering
    "rich",         # terminal formatting, used directly by the preview
    "textual",      # TUI (remind/tui.py)
    "typer",        # CLI (remind/cli.py)
]

[project.optional-dependencies]
dev = ["nuitka"]    # packaging/build.sh -> compiles to machine code

[project.scripts]
remind = "remind.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["remind", "remind.render"]
